name: Prepare real VSD CT
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-vsd.yml'
      - 'scripts/build-web-volume.py'
permissions:
  contents: read
jobs:
  prepare-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install imaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dcm2niix unzip p7zip-full
          python -m pip install --upgrade pip
          python -m pip install nibabel scipy numpy
      - name: Download and verify VSD z053
        run: |
          mkdir -p data/source data/work/z053/archive data/work/z053/nifti
          curl -L --fail --retry 4 -o data/source/z053.zip 'https://zenodo.org/records/8270365/files/z053.zip?download=1'
          echo '423ed28f54a9b498c9fc763f36da98df  data/source/z053.zip' | md5sum -c -
          unzip -q data/source/z053.zip -d data/work/z053/archive
      - name: Expand nested archives and locate imaging files
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('data/work/z053/archive')
          for _ in range(4):
              nested=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.zip','.7z'}]
              if not nested: break
              changed=False
              for p in nested:
                  out=p.parent/(p.stem+'_expanded')
                  if out.exists(): continue
                  out.mkdir(parents=True,exist_ok=True)
                  if p.suffix.lower()=='.zip': subprocess.run(['unzip','-q',str(p),'-d',str(out)],check=True)
                  else: subprocess.run(['7z','x','-y',f'-o{out}',str(p)],check=True,stdout=subprocess.DEVNULL)
                  changed=True
              if not changed: break
          files=[p for p in root.rglob('*') if p.is_file()]
          print('Extracted files:',len(files))
          for p in files: print(p, p.stat().st_size)
          if not files: raise SystemExit('VSD archive extracted no files')
          PY
          find data/work/z053/archive -type f -exec file {} \;
      - name: Normalise imaging data to NIfTI
        run: |
          python - <<'PY'
          from pathlib import Path
          import nibabel as nib
          import numpy as np
          root=Path('data/work/z053/archive'); out=Path('data/work/z053/nifti'); out.mkdir(parents=True,exist_ok=True)
          readable=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try:
                  im=nib.load(str(p)); shape=im.shape
                  spatial=tuple(d for d in shape if d != 1)
                  if len(spatial)==3 and min(spatial)>=32:
                      readable.append((p,im,spatial))
                      print('Nibabel-readable volume:',p,shape,im.header.get_zooms()[:3])
              except Exception: pass
          if readable:
              for i,(p,im,spatial) in enumerate(readable):
                  if len(im.shape)==3: normalised=im
                  else:
                      data=np.asarray(im.get_fdata(dtype=np.float32)).squeeze()
                      if data.ndim != 3: raise RuntimeError(f'Cannot squeeze {p} to 3D: {im.shape}')
                      header=im.header.copy(); header.set_data_shape(data.shape); header.set_data_dtype(np.float32); header.set_slope_inter(1.0,0.0)
                      normalised=nib.Nifti1Image(data,im.affine,header=header)
                  nib.save(normalised,str(out/f'vsd_z053_direct_{i}.nii'))
              Path('data/work/z053/direct-volume-found').write_text('yes')
          PY
          if [ ! -f data/work/z053/direct-volume-found ]; then
            mkdir -p data/work/z053/dicom-flat
            python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('data/work/z053/archive'); flat=Path('data/work/z053/dicom-flat'); n=0
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() in {'.zip','.7z','.txt','.pdf','.csv','.json','.xml','.nii','.gz'}: continue
              target=flat/f'{n:07d}_{p.name}'
              try: target.symlink_to(p.resolve())
              except OSError: shutil.copy2(p,target)
              n+=1
          print('DICOM candidates:',n)
          if n==0: raise SystemExit('No readable volume or DICOM candidates found')
          PY
            dcm2niix -d 9 -z n -f 'vsd_z053_%p_%s' -o data/work/z053/nifti data/work/z053/dicom-flat
          fi
          test -n "$(find data/work/z053/nifti -maxdepth 1 -name '*.nii' -print -quit)" || exit 1
      - name: Select diagnostic CT and build browser volume
        run: |
          python - <<'PY'
          import glob,nibabel as nib,numpy as np,subprocess
          candidates=[]
          for f in glob.glob('data/work/z053/nifti/*.nii'):
            try:
              im=nib.load(f); shape=im.shape
              if len(shape)==3 and min(shape[:2])>=128 and shape[2]>=100:
                step=max(1,shape[2]//40); d=np.asarray(im.dataobj[...,::step],dtype=np.float32); finite=d[np.isfinite(d)]
                if finite.size:
                  p1,p50,p99,p999=np.percentile(finite,[1,50,99,99.9]); mn,mx=float(np.min(finite)),float(np.max(finite)); bone_fraction=float(np.mean(finite>300)); air_fraction=float(np.mean(finite<-500))
                  print('Volume HU check',shape,'p1/p50/p99/p99.9',p1,p50,p99,p999,'range',mn,mx,'air',air_fraction,'bone',bone_fraction,f)
                  # Whole-body CT contains much more air/soft tissue than cortical bone, so p99 can legitimately
                  # remain below 300 HU. Validate a meaningful air fraction plus either high-tail or observed bone.
                  credible_air=p1 < -500 and air_fraction > 0.02
                  credible_bone=p999 > 300 or (mx > 700 and bone_fraction > 0.0001)
                  if credible_air and credible_bone: candidates.append((np.prod(shape),p999-p1,f))
            except Exception as exc: print('Skipping',f,exc)
          if not candidates: raise SystemExit('No credible 3D CT series found after HU-distribution validation')
          candidates.sort(reverse=True); chosen=candidates[0][2]; print('Selected',chosen)
          subprocess.run(['python','scripts/build-web-volume.py',chosen,'public/cases/vsd-z053','--case-id','vsd-z053','--voxel-mm','2.5','--chunk-mb','16'],check=True)
          PY
      - name: Verify generated case
        run: |
          test -s public/cases/vsd-z053/manifest.json
          find public/cases/vsd-z053 -type f -maxdepth 1 -print
      - name: Build application
        run: npm install && npm run build
      - name: Deploy real-volume build
        run: npx wrangler pages deploy dist --project-name bucky-lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
