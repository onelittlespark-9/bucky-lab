name: Prepare real VSD CT
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-vsd.yml']
permissions:
  contents: read
jobs:
  prepare-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install imaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dcm2niix unzip
          python -m pip install --upgrade pip
          python -m pip install nibabel scipy numpy
      - name: Download verified VSD z053
        run: |
          mkdir -p data/source data/work/z053/dicom data/work/z053/nifti
          curl -L --fail --retry 4 -o data/source/z053.zip 'https://zenodo.org/records/8270365/files/z053.zip?download=1'
          echo '423ed28f54a9b498c9fc763f36da98df  data/source/z053.zip' | md5sum -c -
          unzip -q data/source/z053.zip -d data/work/z053/dicom
      - name: Convert DICOM to NIfTI
        run: dcm2niix -z n -f 'vsd_z053_%p_%s' -o data/work/z053/nifti data/work/z053/dicom
      - name: Select diagnostic CT and build browser volume
        run: |
          python - <<'PY'
          import glob,nibabel as nib,numpy as np,subprocess
          candidates=[]
          for f in glob.glob('data/work/z053/nifti/*.nii'):
            try:
              im=nib.load(f); shape=im.shape
              if len(shape)==3 and min(shape[:2])>=128 and shape[2]>=100:
                d=np.asarray(im.dataobj[...,::max(1,shape[2]//20)],dtype=np.float32)
                if np.nanmin(d)<-500 and np.nanmax(d)>300:candidates.append((np.prod(shape),f))
            except Exception: pass
          if not candidates: raise SystemExit('No credible 3D CT series found')
          candidates.sort(reverse=True); chosen=candidates[0][1]; print('Selected',chosen)
          subprocess.run(['python','scripts/build-web-volume.py',chosen,'public/cases/vsd-z053','--case-id','vsd-z053','--voxel-mm','2.5','--chunk-mb','16'],check=True)
          PY
      - name: Build application
        run: npm install && npm run build
      - name: Deploy real-volume build
        run: npx wrangler pages deploy dist --project-name bucky-lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
